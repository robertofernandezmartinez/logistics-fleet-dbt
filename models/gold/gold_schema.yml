version: 2

models:
  - name: gold_fleet_stats
    description: "Final table for fleet efficiency dashboard"
    columns:
      - name: vehicle_model
        tests:
          - not_null
      - name: avg_efficiency_100km
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200